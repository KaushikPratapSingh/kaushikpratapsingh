name: Apply site polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Guide v2 changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return False
              if old not in s:
                  print(f'Skip: pattern not found in {path}')
                  return False
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'Updated {path}')
              return True

          # 1. Keep Leadership in the homepage navigation, alongside the other chapters.
          replace_once(
              'index.html',
              '<li><a href="#research">Research</a></li><li><a href="#now">Now</a></li>',
              '<li><a href="#research">Research</a></li><li><a href="leadership.html">Leadership</a></li><li><a href="#now">Now</a></li>'
          )

          # 2. Surface the strongest verified research evidence without changing the research page.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- guide-v2-research-snapshot -->'
          snapshot = '''<!-- guide-v2-research-snapshot --><div class="research-snapshot reveal"><div><div class="label mono">Verified evidence</div><h3>74.72% LOSO accuracy</h3><p>50-subject cohort · p = 1.36 × 10<sup>−7</sup></p></div><a class="btn" href="research.html">See the full research trail →</a></div>'''
          if marker not in s:
              anchor = '<div class="chapter reveal"><div class="chapter-no">Q</div><div><div class="chapter-meta mono">The question</div>'
              if anchor in s:
                  s = s.replace(anchor, snapshot + anchor, 1)
                  p.write_text(s, encoding='utf-8')

          # Add only the small styling needed by the evidence strip.
          css = Path('assets/css/theme.css')
          cs = css.read_text(encoding='utf-8')
          if '.research-snapshot' not in cs:
              cs += '\n/* Guide v2: research evidence snapshot */\n.research-snapshot{max-width:900px;margin:0 auto 42px;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:28px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.research-snapshot h3{margin:7px 0 5px;font-family:Fraunces,serif;font-size:1.8rem}.research-snapshot p{margin:0;color:var(--muted)}.research-snapshot .label{color:var(--teal);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.research-snapshot{flex-direction:column;align-items:flex-start}}\n'
              css.write_text(cs, encoding='utf-8')

          # 3. Connect the three major chapters from their natural endpoints.
          def add_crosslink(path, marker, block):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  return
              closing = '</main>'
              if closing not in s:
                  print(f'Skip cross-link: {closing} not found in {path}')
                  return
              s = s.replace(closing, block + closing, 1)
              p.write_text(s, encoding='utf-8')

          add_crosslink(
              'research.html',
              '<!-- guide-v2-research-links -->',
              '''<!-- guide-v2-research-links --><section class="section" style="padding-top:48px"><div class="wrap"><div class="cross-link"><strong>The same instinct continues.</strong> The question that became this research grew from the same habit that shaped my <a href="leadership.html">work with people</a> and my <a href="writing.html">book</a>: enter something I do not fully understand, stay with it, and learn by building.</div></div></section>'''
          )

          add_crosslink(
              'writing.html',
              '<!-- guide-v2-writing-links -->',
              '''<!-- guide-v2-writing-links --><section class="section" style="padding-top:48px"><div class="wrap"><div class="cross-link"><strong>The book was one chapter, not the whole story.</strong> Explore the <a href="leadership.html">people and making</a> that shaped how I work, or follow the question that became my <a href="research.html">research journey</a>.</div></div></section>'''
          )

          # 4. Keep the repository clean: this workflow is a one-shot migration helper.
          wf = Path('.github/workflows/site-polish.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Polish site navigation and chapter connections"
          git push
