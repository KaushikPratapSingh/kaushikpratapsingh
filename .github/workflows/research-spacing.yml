name: Research panel spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visual separation
        shell: python
        run: |
          from pathlib import Path

          p = Path('research.html')
          s = p.read_text(encoding='utf-8')

          old = '.heatmap-wrap.active-mode-panel{display:flex}\n.wave-wrap.active-mode-panel{display:block}'
          new = '.heatmap-wrap.active-mode-panel{display:flex;margin-top:24px}\n.wave-wrap.active-mode-panel{display:block}'
          if old in s and 'margin-top:24px' not in s:
              s = s.replace(old, new, 1)

          old = '.tsne-wrap.active-mode-panel{display:flex}'
          new = '.tsne-wrap.active-mode-panel{display:flex;margin-top:24px}'
          if old in s and '.tsne-wrap.active-mode-panel{display:flex;margin-top:24px}' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/research-spacing.yml')
          wf.unlink()

      - name: Commit spacing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.html .github/workflows/research-spacing.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add spacing between research visualization panels"
          git push
